<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1813"/>
      <stop offset="100%" stop-color="#070d0a"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#10b981" stroke-opacity="0.35" stroke-width="4"/>

  <!-- Clock Outline -->
  <circle cx="256" cy="256" r="150" fill="#0a120e" stroke="url(#emeraldGlow)" stroke-width="16" filter="url(#glow)"/>
  
  <!-- Subtle ticks -->
  <line x1="256" y1="124" x2="256" y2="140" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="372" x2="256" y2="388" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
  <line x1="124" y1="256" x2="140" y2="256" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
  <line x1="372" y1="256" x2="388" y2="256" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>

  <!-- Clock Hands (10:10 position) -->
  <!-- Hour hand -->
  <line x1="256" y1="256" x2="185" y2="170" stroke="#f3f4f6" stroke-width="14" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="256" y1="256" x2="330" y2="160" stroke="url(#emeraldGlow)" stroke-width="12" stroke-linecap="round"/>

  <!-- Center Pin -->
  <circle cx="256" cy="256" r="14" fill="#10b981"/>
  <circle cx="256" cy="256" r="6" fill="#010302"/>
</svg>