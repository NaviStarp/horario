<!doctype html>
<html lang="es" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />

		<!-- PWA Primary Meta Tags -->
		<meta name="theme-color" content="#070d0a" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Horario" />
		<meta name="description" content="Horario diario, notas rápidas y diario personal con sincronización privada Supabase" />

		<!-- Icons & Manifest -->
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/icons/icon.svg" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/icon-192.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />

		<!-- Fuentes optimizadas (sin bloquear renderizado) -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" />
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
		<noscript>
			<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
		</noscript>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-[#010302] text-[#f3f4f6] font-sans antialiased selection:bg-[#10b981]/25 selection:text-[#34d399]">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
