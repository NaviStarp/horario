<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="emeraldGlowM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="bgGlowM" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1813"/>
      <stop offset="100%" stop-color="#070d0a"/>
    </radialGradient>
    <filter id="glowM" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full Bleed Maskable Background -->
  <rect width="512" height="512" fill="url(#bgGlowM)"/>

  <!-- Centered Safe-zone Clock (radius 120, well within safe center circle) -->
  <circle cx="256" cy="256" r="120" fill="#0a120e" stroke="url(#emeraldGlowM)" stroke-width="14" filter="url(#glowM)"/>

  <!-- Subtle ticks -->
  <line x1="256" y1="150" x2="256" y2="162" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <line x1="256" y1="350" x2="256" y2="362" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <line x1="150" y1="256" x2="162" y2="256" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <line x1="350" y1="256" x2="362" y2="256" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>

  <!-- Clock Hands -->
  <line x1="256" y1="256" x2="200" y2="188" stroke="#f3f4f6" stroke-width="12" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="315" y2="180" stroke="url(#emeraldGlowM)" stroke-width="10" stroke-linecap="round"/>

  <circle cx="256" cy="256" r="12" fill="#10b981"/>
  <circle cx="256" cy="256" r="5" fill="#010302"/>
</svg>